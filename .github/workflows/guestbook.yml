name: Process Guestbook

on:
  issues:
    types: [opened]

jobs:
  add-guestbook:
    if: |
      contains(github.event.issue.labels.*.name, 'guestbook')
      || startsWith(github.event.issue.title, '[Guestbook]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and add entry
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const title = context.payload.issue.title || '';
            const github = context.payload.issue.user.login;

            const name = title.replace(/^\[Guestbook\]\s*/, '').trim();
            const date = new Date().toISOString().split('T')[0];

            const msgMatch = body.match(/\*\*Message:\*\*\s*\n\n([\s\S]*)$/);
            const message = msgMatch ? msgMatch[1].trim() : '';

            core.setOutput('name', name);
            core.setOutput('date', date);
            core.setOutput('message', message);
            core.setOutput('github', github);

      - name: Add to guestbook.yml
        run: |
          NAME="${{ steps.extract.outputs.name }}"
          DATE="${{ steps.extract.outputs.date }}"
          MESSAGE="${{ steps.extract.outputs.message }}"
          GITHUB_USER="${{ steps.extract.outputs.github }}"
          ENTRY="- name: \"$NAME\"\n  date: \"$DATE\"\n  message: \"$MESSAGE\"\n  github: \"$GITHUB_USER\""
          printf "\n%s" "$ENTRY" >> _data/guestbook.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/guestbook.yml
          git commit -m "Add guestbook entry from ${{ steps.extract.outputs.name }}"
          git push

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
