title: "João Santos"
description: "Personal blog — Windows Aero vibes"
url: "https://joaosantosg.github.io"
baseurl: "/personal-blog"
permalink: /:categories/:title/

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10
paginate_path: "/blog/page:num/"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - PLAN.md
  - README.md

include:
  - pages

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

collections:
  pages:
    output: true
    permalink: /:path/
